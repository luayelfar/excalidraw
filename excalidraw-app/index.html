    <!------------------------------------------------------------------------->
    <!--   to minimize white flash on load when user has dark mode enabled   -->
    <script>
      try {
        function setTheme(theme) {
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        }

        function getTheme() {
          const theme = window.localStorage.getItem("excalidraw-theme");

          if (theme && theme === "system") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            return theme || "light";
          }
        }

        setTheme(getTheme());
      } catch (e) {
        console.error("Error setting dark mode", e);
      }
    </script>
    <style>
      html.dark {
        background-color: #121212;
        color: #fff;
      }
    </style>

    <!-- Warmup the connection for Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!------------------------------------------------------------------------->
    <% if (typeof PROD != 'undefined' && PROD == true) { %>
    <script>
      // Redirect Excalidraw+ users which have auto-redirect enabled.
      //
      // Redirect only the bare root path, so link/room/library urls are not
      // redirected.
      //
      // Putting into index.html for best performance (can't redirect on server
      // due to location.hash checks).
      if (
        window.location.pathname === "/" &&
        !window.location.hash &&
        !window.location.search &&
        // if its present redirect
        document.cookie.includes("excplus-autoredirect=true")
      ) {
        window.location.href = "https://app.excalidraw.com";
      }
    </script>

    <!-- Following placeholder is replaced during the build step -->
    <!-- PLACEHOLDER:EXCALIDRAW_APP_FONTS -->

    <!-- Register Assistant as the UI font, before the scene inits -->
    <link
      rel="stylesheet"
      href="../packages/excalidraw/fonts/fonts.css"
      type="text/css"
    />

    <% } else { %>
    <script>
      window.EXCALIDRAW_ASSET_PATH = window.origin;
    </script>
    <% } %>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Excalidraw version -->
    <meta name="version" content="{version}" />

    <% if (typeof VITE_APP_DEV_DISABLE_LIVE_RELOAD != 'undefined' &&
    VITE_APP_DEV_DISABLE_LIVE_RELOAD == true) { %>
    <script>
      {
        const _WebSocket = window.WebSocket;
        window.WebSocket = function (url) {
          if (/ws:\/\/localhost:.+?\/sockjs-node/.test(url)) {
            console.info(
              "[!!!] Live reload is disabled via VITE_APP_DEV_DISABLE_LIVE_RELOAD [!!!]",
            );
          } else {
            return new _WebSocket(url);
          }
        };
      }
    </script>
    <% } %>
    <script>
      // setting this so that libraries installation reuses this window tab.
      window.name = "_excalidraw";
    </script>

    <!-- FIXME: remove this when we update CRA (fix SW caching) -->
    <style>
      body,
      html {
        margin: 0;
        -webkit-text-size-adjust: 100%;

        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .visually-hidden {
        position: absolute !important;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip: rect(1px, 1px, 1px, 1px);
        white-space: nowrap;
        user-select: none;
      }

      #root {
        height: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      @media screen and (min-width: 1200px) {
        #root {
          -webkit-touch-callout: default;
          -webkit-user-select: auto;
          -khtml-user-select: auto;
          -moz-user-select: auto;
          -ms-user-select: auto;
          user-select: auto;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <header>
      <h1 class="visually-hidden">Excalidraw</h1>
    </header>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <% if (typeof PROD != 'undefined' && PROD == true) { %>
    <!-- 100% privacy friendly analytics -->
    <script>
      // need to load this script dynamically bcs. of iframe embed tracking
      var scriptEle = document.createElement("script");
      scriptEle.setAttribute(
        "src",
        "https://scripts.simpleanalyticscdn.com/latest.js",
      );
      scriptEle.setAttribute("type", "text/javascript");
      scriptEle.setAttribute("defer", true);
      scriptEle.setAttribute("async", true);
      // if iframe
      if (window.self !== window.top) {
        scriptEle.setAttribute("data-auto-collect", true);
      }

      document.body.appendChild(scriptEle);

      // if iframe
      if (window.self !== window.top) {
        scriptEle.addEventListener("load", () => {
          if (window.sa_pageview) {
            window.window.sa_event(action, {
              category: "iframe",
              label: "embed",
              value: window.location.pathname,
            });
          }
        });
      }
    </script>
    <!-- end LEGACY GOOGLE ANALYTICS -->
    <% } %>
<!-- ========================================== -->
    <!-- 🚀 SUPABASE ABSOLUTE STABILITY HUB (FINAL) -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // مسدود کردن سرورهای عمومی Excalidraw برای جلوگیری از کرش
      const originalFetch = window.fetch;
      window.fetch = async function() {
        if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('json.excalidraw.com')) {
          return new Response(JSON.stringify({ id: "enterprise-fake-id" }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }
        return originalFetch.apply(this, arguments);
      };

      window.addEventListener('load', async () => {
        // ۱. کلیدهای هسته مرکزی (دقیقاً کلیدهای خودتان را جایگذاری کنید)
        const SUPABASE_URL = 'https://wzuziwmasrwrxgsbbcgk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TGIYmi_FfPzD05Y0OH8R-Q_PVPwewXL';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ۲. رابط کاربریِ وضعیت
        const uiWidget = document.createElement('div');
        uiWidget.style.cssText = 'position: fixed; bottom: 24px; left: 24px; z-index: 9999; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 16px; font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; color: #1f2937; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; pointer-events: none;';
        document.body.appendChild(uiWidget);

        const PERMANENT_ROOM = '#room=876717e134d14e5e46af,A0mPtDJGKIi9YLy851vbXg';
        const localData = localStorage.getItem('excalidraw');
        const isBoardEmpty = (!localData || localData === '[]' || localData === '{}');

        // ۳. قانون اول معماری: اول دریافتِ دیتای مستر، بعد ورود به اتاق
        if (isBoardEmpty) {
            uiWidget.innerHTML = '📥 در حال دریافت اطلاعات از سرور مرکزی...';
            try {
                // دریافت آخرین بک‌آپ معتبر از دیتابیس
                const { data } = await supabase.from('drawings').select('canvas_data').order('id', { ascending: false }).limit(1);
                if (data && data.length > 0 && data[0].canvas_data) {
                    localStorage.setItem('excalidraw', JSON.stringify(data[0].canvas_data));
                }
            } catch (err) { console.error(err); }
            
            // حالا که حافظه پر شد، وارد اتاق شو
            window.location.hash = PERMANENT_ROOM;
            window.location.reload();
            return;
        }

        // ۴. اگر حافظه پر است اما در اتاق نیستیم، وارد اتاق شو
        if (!window.location.hash.includes('room=')) {
          window.location.hash = PERMANENT_ROOM;
          window.location.reload();
          return; 
        }

        uiWidget.innerHTML = '⚡ سیستم یکپارچه متصل است';

        // ۵. ایجنت ذخیره‌ساز (Auto-Save) بدون فشار به سیستم
        let lastSavedData = localStorage.getItem('excalidraw') || '';
        setInterval(async () => {
          const currentData = localStorage.getItem('excalidraw');
          
          if (currentData && currentData !== lastSavedData && currentData !== '[]') {
            uiWidget.innerHTML = '🔄 در حال همگام‌سازی امن...';
            try {
                const parsedData = JSON.parse(currentData);
                // آپدیت دائمی ردیف شماره 1 برای جلوگیری از شلوغی دیتابیس
                const { error } = await supabase.from('drawings').upsert([{ id: 1, canvas_data: parsedData }]);
                
                if (!error) {
                  lastSavedData = currentData;
                  uiWidget.innerHTML = '✅ همگام‌سازی با موفقیت انجام شد';
                }
            } catch(e) { console.log(e); }
            
            setTimeout(() => { uiWidget.innerHTML = '⚡ سیستم یکپارچه متصل است'; }, 3000);
          }
        }, 10000);
      });
    </script>
    <!-- ========================================== -->
    </body>
</html>
